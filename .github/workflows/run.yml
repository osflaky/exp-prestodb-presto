name: ci-expansion prestodb/presto
'on':
  push:
    branches:
    - run/**
jobs:
  arrowflight-java-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java:
        - 8
        - 17
        - 25
        modules:
        - :presto-common-arrow
        - :presto-base-arrow-flight
        - :presto-flight-shim
        os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - windows-latest
        - windows-11-arm
        - macos-15-intel
        - macos-latest
        attempt:
        - 1
      max-parallel: 10
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.modules }}-${{ github.event.pull_request.number }}-${{ matrix.java }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.codechange == 'true'
      with:
        show-progress: false
        persist-credentials: false
        repository: prestodb/presto
        ref: f0872041be5b270237dcdf7da13445b51d1756d3
    - uses: actions/checkout@v4
      with:
        path: _ci_expansion
    - shell: bash
      working-directory: .
      run: f=$GITHUB_WORKSPACE/_ci_expansion/subject.patch; if [ -s $f ]; then git apply --ignore-whitespace $f; fi; rm -rf $GITHUB_WORKSPACE/_ci_expansion
    - uses: actions/setup-java@v5
      if: needs.changes.outputs.codechange == 'true'
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Clean up before build
      if: needs.changes.outputs.codechange == 'true'
      run: 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

        sudo rm -rf /opt/hostedtoolcache/CodeQL

        df -h

        docker system prune -af || true

        '
    - name: Download nodejs to maven cache
      if: needs.changes.outputs.codechange == 'true'
      run: .github/bin/download_nodejs
    - name: Maven Install
      if: needs.changes.outputs.codechange == 'true'
      run: 'export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"

        ./mvnw install ${MAVEN_FAST_INSTALL} -e -am -pl ${{ matrix.modules }}

        '
    - name: Maven Tests
      if: needs.changes.outputs.codechange == 'true'
      run: ./mvnw test ${MAVEN_TEST} -pl ${{ matrix.modules }} -Dtest="*,!TestArrowFlightNativeQueries*,!TestArrowFederationNativeQueries*"
    name: arrowflight-java-tests (${{ matrix.java }}, ${{ matrix.modules }}, ${{ matrix.os }}, ${{ matrix.attempt }})
  arrowflight-native-e2e-tests:
    runs-on: ${{ matrix.os }}
    container:
      image: prestodb/presto-native-dependency:0.300-202610051009-aa529216
      volumes:
      - /usr:/host_usr
      - /opt:/host_opt
    env:
      INSTALL_PREFIX: ${{ github.workspace }}/adapter-deps/install
    strategy:
      fail-fast: false
      matrix:
        include:
        - modules: :presto-base-arrow-flight
          testArgs: -Dtest="TestArrowFlightNativeQueries*"
          connectorType: base
          os: ubuntu-latest
          java: 8
